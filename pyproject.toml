[project]
name = "altissimo-stripe"
version = "0.1.0"
description = "Altissimo Stripe client, webhook handler, and typed helpers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
stripe = ["stripe>=8.0,<13.0"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "altissimo", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest-cov = ">=6.0"
pre-commit = ">=4.0"
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.8"
mypy = ">=1.13"
stripe = ">=8.0,<13.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "PT", "TCH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.coverage.run]
source = ["altissimo"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT011"]
"src/altissimo/stripe/client.py" = ["S107"]
